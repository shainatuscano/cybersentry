[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "cybersentry"
version = "0.1.0"
description = "Research-oriented AI-powered cybersecurity investigation pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "CyberSentry Research Team"}
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scikit-learn>=1.4",
    "xgboost>=2.0",
    "pyarrow>=15.0",
    "joblib>=1.3",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "pydantic>=2.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
]
api = [
    "fastapi>=0.110",
    "uvicorn>=0.29",
]
agents = [
    "langchain>=0.1.0",
    "langgraph>=0.0.10",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["cybersentry*"]  # src/ml and src/api are run in place as `python -m src.ml...`

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore::DeprecationWarning",
]
